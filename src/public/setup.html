<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Configurar Agenda Avanzada</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <nav
      class="navbar navbar-expand-lg navbar-dark bg-dark mb-4"
    >
      <div class="container">
        <a class="navbar-brand fw-bold" href="/">
          Atención Podológica
        </a>
        <div class="d-flex gap-2">
          <a class="btn btn-outline-light" href="/">
            Solicitar Turno
          </a>
          <a
            class="btn btn-primary active"
            href="/setup"
          >
            Cargar Agenda
          </a>
          <a
            class="btn btn-outline-light"
            href="/dashboard"
          >
            Panel Profesional
          </a>
        </div>
      </div>
    </nav>

    <div
      class="container mb-5"
      style="max-width: 800px"
    >
      <div class="card shadow p-4">
        <h2 class="text-center mb-4">
          Generador de Agenda Inteligente
        </h2>

        <div class="card p-3 mb-3 bg-white">
          <h5>1. Período a Generar</h5>
          <div class="row">
            <div class="col">
              <label class="form-label">
                Seleccionar Mes
              </label>
              <select
                id="monthSelect"
                class="form-select"
                onchange="updateDatePreview()"
              >
                <option value="current">
                  Resto del Mes Actual
                </option>
                <option value="next">
                  Todo el Mes Siguiente
                </option>
              </select>
            </div>
            <div class="col d-flex align-items-end">
              <div
                id="datePreview"
                class="text-muted small pb-2"
              ></div>
            </div>
          </div>
        </div>

        <div class="card p-3 mb-3 bg-white">
          <h5>
            2. Feriados y Días No Laborables
          </h5>
          <div
            class="input-group mb-2"
            style="max-width: 300px"
          >
            <input
              type="date"
              id="holidayInput"
              class="form-control"
            />
            <button
              class="btn btn-secondary"
              onclick="addHoliday()"
            >
              Bloquear
            </button>
          </div>
          <div
            id="holidayList"
            class="d-flex flex-wrap gap-2"
          ></div>
        </div>

        <div class="card p-3 mb-4 bg-white">
          <h5>
            3. Horarios por Día (Lunes a Sábado)
          </h5>
          <div
            class="row row-cols-1 row-cols-md-3 g-3"
            id="weekTemplateContainer"
          ></div>
        </div>

        <button
          class="btn btn-success w-100 btn-lg"
          onclick="buildAgenda()"
        >
          Generar y Publicar Agenda
        </button>
      </div>
    </div>

   <script src="../js/setup.js"></script>
  </body>
</html>
