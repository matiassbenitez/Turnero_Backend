<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Panel Profesional</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <style>
            .card-appointment {
                border-left: 5px solid #6c757d;
            }
            .card-appointment.status-available {
                border-left-color: #198754;
            }
            .card-appointment.status-booked {
                border-left-color: #dc3545;
            }
            .card-appointment.status-inactive {
                border-left-color: #6c757d;
                opacity: 0.7;
            }
        </style>
    </head>
    <body class="bg-light">
        <nav
      class="navbar navbar-expand-lg navbar-dark bg-dark mb-4"
    >
      <div class="container">
        <a class="navbar-brand fw-bold" href="/">
          Atención Podológica
        </a>
        <div class="d-flex gap-2">
          <a class="btn btn-outline-light" href="/">
            Solicitar Turno
          </a>
          <a
            class="btn btn-outline-light"
            href="/setup"
          >
            Cargar Agenda
          </a>
          <a
            class="btn btn-primary active"
            href="/dashboard"
          >
            Panel Profesional
          </a>
        </div>
      </div>
    </nav>

        <div class="container px-3 mb-5">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="m-0 fw-bold">Planilla de Turnos</h4>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-12 col-md-auto d-flex gap-1">
                    <button
                        id="btn-all"
                        class="btn btn-sm btn-primary flex-fill"
                        onclick="setFilter('all')"
                    >
                        Todos
                    </button>
                    <button
                        id="btn-today"
                        class="btn btn-sm btn-outline-primary flex-fill"
                        onclick="setFilter('today')"
                    >
                        Hoy
                    </button>
                    <button
                        id="btn-week"
                        class="btn btn-sm btn-outline-primary flex-fill"
                        onclick="setFilter('week')"
                    >
                        Semana
                    </button>
                </div>

                <div class="col-12 d-none" id="weekPaging">
                    <div class="input-group input-group-sm">
                        <button
                            class="btn btn-secondary"
                            onclick="changeWeek(-1)"
                        >
                            &laquo; Ant
                        </button>
                        <span
                            class="input-group-text bg-white flex-fill text-center small"
                            id="weekLabel"
                        >
                            Semana
                        </span>
                        <button
                            class="btn btn-secondary"
                            onclick="changeWeek(1)"
                        >
                            Sig &raquo;
                        </button>
                    </div>
                </div>
            </div>

            <div class="form-check form-switch mb-3">
                <input
                    class="form-check-input"
                    type="checkbox"
                    id="showAvailableCheck"
                    checked
                    onchange="renderView()"
                />
                <label
                    class="form-check-label small fw-bold"
                    for="showAvailableCheck"
                >
                    Mostrar turnos libres
                </label>
            </div>

            <div id="cardsContainer" class="d-md-none"></div>

            <div class="table-responsive d-none d-md-block card shadow-sm">
                <table class="table table-striped align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Fecha y Hora</th>
                            <th>Estado</th>
                            <th>Paciente</th>
                            <th>Contacto</th>
                            <th>Detalles</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="appointmentsTable"></tbody>
                </table>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../js/dashboard.js"></script>
    </body>
</html>
