<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Configurar Agenda Avanzada</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-4 mb-5" style="max-width: 800px;">
    <div class="card shadow p-4">
      <h2 class="text-center mb-4">Generador de Agenda Inteligente</h2>

      <div class="card p-3 mb-3 bg-white">
        <h5>1. Período a Generar</h5>
        <div class="row">
          <div class="col">
            <label class="form-label">Seleccionar Mes</label>
            <select id="monthSelect" class="form-select" onchange="updateDatePreview()">
              <option value="current">Resto del Mes Actual</option>
              <option value="next">Todo el Mes Siguiente</option>
            </select>
          </div>
          <div class="col d-flex align-items-end">
            <div id="datePreview" class="text-muted small pb-2"></div>
          </div>
        </div>
      </div>

      <div class="card p-3 mb-3 bg-white">
        <h5>2. Feriados y Días No Laborables (Excepciones)</h5>
        <div class="input-group mb-2" style="max-width: 300px;">
          <input type="date" id="holidayInput" class="form-control">
          <button class="btn btn-secondary" onclick="addHoliday()">Bloquear</button>
        </div>
        <div id="holidayList" class="d-flex flex-wrap gap-2"></div>
      </div>

      <div class="card p-3 mb-4 bg-white">
        <h5>3. Horarios por Día de la Semana (Lunes a Sábado)</h5>
        <div class="row row-cols-1 row-cols-md-3 g-3" id="weekTemplateContainer">
          </div>
      </div>

      <button class="btn btn-success w-100 btn-lg" onclick="buildAgenda()">
        Generar y Publicar Agenda
      </button>
    </div>
  </div>

  <script>
    const holidays = [];
    const daysOfWeek = [
      'Domingo', 'Lunes', 'Martes', 
      'Miércoles', 'Jueves', 'Viernes', 'Sábado'
    ];
    
    // Configuración base de horarios por día (Editable)
    const defaultSchedule = {
      1: ['08:00', '09:00', '10:00', '11:00', '12:00', '17:00', '18:00', '19:00', '20:00'], // Lunes
      2: ['08:00', '09:00', '10:00', '11:00', '12:00', '17:00', '18:00', '19:00', '20:00'], // Martes
      3: ['08:00', '09:00', '10:00', '11:00', '12:00', '17:00', '18:00', '19:00', '20:00'], // Miércoles
      4: ['08:00', '09:00', '10:00', '11:00', '12:00', '17:00', '18:00', '19:00', '20:00'], // Jueves
      5: ['08:00', '09:00', '10:00', '11:00', '12:00', '17:00', '18:00', '19:00', '20:00'], // Viernes
      6: ['08:00', '09:00', '10:00', '11:00', '12:00', '17:00', '18:00', '19:00', '20:00']  // Sábado
    };

    // Renderizar la matriz de días y horarios
    const container = document.getElementById('weekTemplateContainer');
    for (let i = 1; i <= 6; i++) {
      const hoursHtml = defaultSchedule[i].map(h => `
        <div class="form-check">
          <input class="form-check-input hour-check" type="checkbox" value="${h}" data-day="${i}" checked>
          <label class="form-check-label small">${h}</label>
        </div>
      `).join('');

      container.innerHTML += `
        <div class="col">
          <div class="p-2 border rounded bg-light">
            <h6 class="border-bottom pb-1 text-primary">${daysOfWeek[i]}</h6>
            ${hoursHtml}
          </div>
        </div>
      `;
    }

    // Mostrar info del rango seleccionado
    function updateDatePreview() {
      const mode = document.getElementById('monthSelect').value;
      const range = getDatesRange(mode);
      document.getElementById('datePreview').innerText = 
        `Se generará desde el ${range.start.toLocaleDateString()} al ${range.end.toLocaleDateString()}`;
    }

    // Helper para calcular rangos de fechas (Evita días pasados)
    function getDatesRange(mode) {
      const now = new Date();
      let start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      let end = new Date(now.getFullYear(), now.getMonth() + 1, 0);

      if (mode === 'next') {
        start = new Date(now.getFullYear(), now.getMonth() + 1, 1);
        end = new Date(now.getFullYear(), now.getMonth() + 2, 0);
      }
      return { start, end };
    }

    // Gestión de feriados
    function addHoliday() {
      const input = document.getElementById('holidayInput');
      if (!input.value) return;
      if (!holidays.includes(input.value)) {
        holidays.push(input.value);
        renderHolidays();
      }
      input.value = '';
    }

    function renderHolidays() {
      const list = document.getElementById('holidayList');
      list.innerHTML = holidays.map((h, idx) => `
        <span class="badge bg-danger p-2">
          ${h} <button class="btn-close btn-close-white ms-1" style="font-size:0.5rem" onclick="holidays.splice(${idx},1);renderHolidays()"></button>
        </span>
      `).join('');
    }

    // Algoritmo principal (Cruza todo)
    async function buildAgenda() {
      const mode = document.getElementById('monthSelect').value;
      const { start, end } = getDatesRange(mode);
      
      // Capturar horarios seleccionados de la pantalla
      const activeSchedule = { 1:[], 2:[], 3:[], 4:[], 5:[], 6:[] };
      document.querySelectorAll('.hour-check:checked').forEach(el => {
        const day = el.getAttribute('data-day');
        activeSchedule[day].push(el.value);
      });

      const slots = [];
      let current = new Date(start);

      // Bucle día por día dentro del rango
      while (current <= end) {
        const dayOfWeek = current.getDay(); // 0=Dom, 1=Lun...
        
        // Formato YYYY-MM-DD para comparar con feriados
        const dateStr = current.toISOString().split('T')[0];

        // Reglas de exclusión: No domingos, No feriados
        if (dayOfWeek !== 0 && !holidays.includes(dateStr)) {
          const hours = activeSchedule[dayOfWeek] || [];
          
          hours.forEach(hour => {
            slots.push({ dateTime: `${dateStr} ${hour}` });
          });
        }
        current.setDate(current.getDate() + 1);
      }

      if (slots.length === 0) {
        return alert('No se generaron turnos. Revisá la configuración.');
      }

      // Enviar lote al backend
      const res = await fetch('/api/appointments/bulk', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slots })
      });

      if (res.ok) {
        alert(`¡Agenda publicada! Se crearon ${slots.length} turnos.`);
      }
    }

    updateDatePreview();
  </script>
</body>
</html>
