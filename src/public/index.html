<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Reserva de Turnos</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
    </head>
    <body class="bg-light">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
            <div class="container">
                <a class="navbar-brand fw-bold" href="/">
                    Atención Podológica
                </a>
                <div class="d-flex gap-2">
                    <a class="btn btn-primary active" href="/">
                        Solicitar Turno
                    </a>
                    <a class="btn btn-outline-light" href="/setup">
                        Cargar Agenda
                    </a>
                    <a class="btn btn-outline-light" href="/dashboard">
                        Panel Profesional
                    </a>
                </div>
            </div>
        </nav>

        <div class="container mb-5">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="card shadow p-4">
                        <h3 class="card-title text-center mb-4">
                            Reserva tu Turno
                        </h3>

                        <form id="bookingForm" onsubmit="handleBooking(event)">
                            <div class="mb-3">
                                <label class="form-label fw-bold">
                                    1. Seleccioná Fecha y Hora
                                </label>
                                <select
                                    class="form-select"
                                    id="appointmentSelect"
                                    required
                                >
                                    <option value="">
                                        Cargando horarios disponibles...
                                    </option>
                                </select>
                            </div>

                            <!-- 2. BÚSQUEDA Y DATOS DEL PACIENTE -->
                            <div class="mb-3 position-relative">
                                <label class="form-label fw-bold">
                                    2. Buscar Paciente (Nombre / Teléfono / DNI)
                                </label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="searchInput"
                                    placeholder="Escribí para buscar..."
                                    oninput="onSearchInput(event)"
                                    autocomplete="off"
                                />
                                <div
                                    id="searchResults"
                                    class="list-group position-absolute w-100 shadow d-none"
                                    style="z-index: 1000"
                                ></div>
                                <div
                                    id="searchHelp"
                                    class="form-text text-muted"
                                >
                                    Si no estás registrado, completá los datos
                                    abajo.
                                </div>
                            </div>

                            <input
                                type="hidden"
                                id="existingPatientId"
                                value=""
                            />

                            <div class="mb-3">
                                <label class="form-label fw-bold">
                                    Nombre Completo *
                                </label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="fullName"
                                    required
                                />
                            </div>

                            <div class="row g-2 mb-3">
                                <div class="col-12 col-sm-6">
                                    <label class="form-label fw-bold">
                                        DNI
                                    </label>
                                    <input
                                        type="text"
                                        class="form-control"
                                        id="dni"
                                    />
                                </div>
                                <div class="col-12 col-sm-6">
                                    <label class="form-label fw-bold">
                                        Teléfono *
                                    </label>
                                    <input
                                        type="tel"
                                        class="form-control"
                                        id="phone"
                                        required
                                    />
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold">
                                    3. Tipo de Atención
                                </label>
                                <select
                                    class="form-select"
                                    id="appointmentType"
                                    required
                                >
                                    <option value="consultorio">
                                        Atención en Consultorio
                                    </option>
                                    <option value="domicilio">
                                        Atención a Domicilio
                                    </option>
                                </select>
                            </div>

                            <button
                                type="submit"
                                class="btn btn-success w-100 py-2 fs-5"
                            >
                                Confirmar Reserva
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <script 
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
        <script src="../js/index.js"></script>
        <!-- MODAL EDITAR PACIENTE -->
<div
  class="modal fade"
  id="editPatientModal"
  tabindex="-1"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">
          Editar Paciente
        </h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <form
          id="editPatientForm"
          onsubmit="handleUpdatePatient(event)"
        >
          <input
            type="hidden"
            id="modalPatientId"
          />

          <div class="mb-3">
            <label class="form-label fw-bold">
              Nombre Completo *
            </label>
            <input
              type="text"
              class="form-control"
              id="modalFullName"
              required
            />
          </div>

          <div class="row g-2 mb-3">
            <div class="col-6">
              <label class="form-label fw-bold">
                DNI
              </label>
              <input
                type="text"
                class="form-control"
                id="modalDni"
              />
            </div>
            <div class="col-6">
              <label class="form-label fw-bold">
                Teléfono *
              </label>
              <input
                type="tel"
                class="form-control"
                id="modalPhone"
                required
              />
            </div>
          </div>

          <div class="d-flex justify-content-end gap-2">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancelar
            </button>
            <button
              type="submit"
              class="btn btn-primary"
              id="savePatientBtn"
            >
              Guardar Cambios
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
    </body>
</html>
