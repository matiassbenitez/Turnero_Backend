<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <title>Turnos - Consultorio</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
    </head>
    <body class="bg-light">
        <div class="container mt-5" style="max-width: 500px">
            <div class="card shadow p-4">
                <h2 class="text-center mb-4">Pedir Turno</h2>
                <form id="appointmentForm">
                    <div class="mb-3">
                        <label class="form-label">Nombre y Apellido</label>
                        <input
                            type="text"
                            id="fullName"
                            class="form-control"
                            required
                        />
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Correo Electrónico</label>
                        <input
                            type="email"
                            id="email"
                            class="form-control"
                            required
                        />
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Teléfono</label>
                        <input
                            type="tel"
                            id="phone"
                            class="form-control"
                            required
                        />
                    </div>

                    <div class="mb-3">
                        <label class="form-label"
                            >Carácter en el Consultorio</label
                        >
                        <select id="userType" class="form-select" required>
                            <option value="docente o gestion">
                                Docente o Gestión
                            </option>
                            <option value="personal no docente">
                                Personal No Docente
                            </option>
                            <option value="estudiante">Estudiante</option>
                            <option value="externo">Externo</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label"
                            >¿Se atendió anteriormente?</label
                        >
                        <select id="isReturning" class="form-select" required>
                            <option value="no">No</option>
                            <option value="sí">Sí</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label"
                            >Seleccione un Turno Disponible</label
                        >
                        <select
                            id="appointmentSelect"
                            class="form-select"
                            required
                        ></select>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Solicitar Turno
                    </button>
                </form>
            </div>
        </div>

        <script>
            const select = document.getElementById("appointmentSelect");
            const form = document.getElementById("appointmentForm");

            // Cargar turnos libres
            async function loadAvailable() {
                const res = await fetch("/api/appointments?status=available");
                const data = await res.json();

                const options = {
                    weekday: "long",
                    day: "numeric",
                    month: "long",
                    hour: "2-digit",
                    minute: "2-digit",
                    hour12: false, // <-- Fuerza formato 24hs
                };

                select.innerHTML = data
                    .map((app) => {
                        const dateObj = new Date(
                            app.dateTime.replace(" ", "T"),
                        );
                        const textAmigable = new Intl.DateTimeFormat(
                            "es-AR",
                            options,
                        ).format(dateObj);

                        // Retornamos sin el "p.m." residual
                        return `<option value="${app._id}">${textAmigable} hs</option>`;
                    })
                    .join("");
            }

            // Enviar el formulario
            form.addEventListener("submit", async (e) => {
                e.preventDefault();

                const payload = {
                    id: select.value,
                    fullName: document.getElementById("fullName").value,
                    email: document.getElementById("email").value,
                    phone: document.getElementById("phone").value,
                    userType: document.getElementById("userType").value,
                    isReturning: document.getElementById("isReturning").value,
                };

                const res = await fetch("/api/appointments", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });

                if (res.ok) {
                    alert("Turno reservado con éxito!");
                    form.reset();
                    loadAvailable();
                }
            });

            loadAvailable();
        </script>
    </body>
</html>
