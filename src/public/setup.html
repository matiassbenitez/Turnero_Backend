<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cargar Agenda - Atención Podológica</title>
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
    rel="stylesheet" 
  />
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold" href="/">Atención Podológica</a>
      <div class="d-flex gap-2">
        <a class="btn btn-outline-light" href="/">Agenda Semanal</a>
        <a class="btn btn-primary active" href="/setup">Cargar Agenda</a>
      </div>
    </div>
  </nav>

  <div class="container mb-5">
    <div class="row justify-content-center">
      <div class="col-12 col-xl-10">
        <div class="card shadow-sm p-4 border-0">
          
          <h3 class="fw-bold mb-1">Configuración de Agenda Masiva</h3>
          <p class="text-muted small mb-4">
            Generá automáticamente los bloques de turnos cada 30 minutos para el mes.
          </p>

          <!-- Configuración Rango de Fechas -->
          <div class="row g-3 mb-4 align-items-end bg-white p-3 border rounded">
            <div class="col-12 col-md-6">
              <label for="monthSelect" class="form-label fw-bold">Periodo a generar</label>
              <select id="monthSelect" class="form-select" onchange="updateDatePreview()">
                <option value="current">Mes Actual</option>
                <option value="next">Próximo Mes</option>
              </select>
            </div>
            <div class="col-12 col-md-6">
              <div class="alert alert-info mb-0 py-2 small" id="datePreview">
                Cargando periodo...
              </div>
            </div>
          </div>

          <!-- Selección de Horarios por Día (Lunes a Sábado) -->
          <h5 class="fw-bold mb-3">Horarios de Atención (Intervalos de 30 min)</h5>
          
          <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-6 g-2 mb-4" id="weekTemplateContainer">
            <!-- Días generados por JS -->
          </div>

          <!-- Feriados o Días Inhabilitados -->
          <div class="mb-4 bg-white p-3 border rounded">
            <label class="form-label fw-bold">Excluir Fechas / Feriados</label>
            <div class="input-group mb-2" style="max-width: 350px;">
              <input type="date" id="holidayInput" class="form-control" />
              <button type="button" class="btn btn-outline-danger" onclick="addHoliday()">
                Agregar Feriado
              </button>
            </div>
            <div id="holidayList" class="d-flex flex-wrap gap-1"></div>
          </div>

          <!-- Botón Generar -->
          <button type="button" class="btn btn-success btn-lg w-100 fw-bold shadow-sm" onclick="buildAgenda()">
            ⚡ Generar y Publicar Horarios
          </button>

        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/setup.js"></script>
</body>
</html>
